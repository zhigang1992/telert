<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telert: Telegram notifications via webhook</title>
<meta name="description" content="Send Telegram notifications from any script with one webhook URL. API docs with previews of what arrives in Telegram.">
<meta name="color-scheme" content="light dark">
<style>
:root {
  --bg: #ffffff;
  --fg: #1c1c1e;
  --muted: #646468;
  --border: #e3e3e6;
  --code-bg: #f5f5f7;
  --accent: #1d6fd8;
  --accent-fg: #ffffff;
  --chat-bg: #dfe7ec;
  --bubble: #ffffff;
  --bubble-fg: #111111;
  --bubble-muted: #8a959c;
  --tg-link: #168acd;
  --tg-code: rgba(0, 0, 0, 0.06);
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121214;
    --fg: #e9e9ec;
    --muted: #9b9ba3;
    --border: #2b2b30;
    --code-bg: #1a1a1d;
    --accent: #5aa0ff;
    --accent-fg: #0b1220;
    --chat-bg: #0e1621;
    --bubble: #182533;
    --bubble-fg: #f5f5f5;
    --bubble-muted: #6d8296;
    --tg-link: #6ab3f3;
    --tg-code: rgba(255, 255, 255, 0.08);
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, pre { font-family: var(--mono); }
.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

/* top bar */
.top { border-bottom: 1px solid var(--border); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
.brand { font-weight: 650; color: var(--fg); letter-spacing: -0.01em; }
.brand:hover { text-decoration: none; }

/* entry point */
.intro { padding: 56px 0 40px; max-width: 680px; }
.intro h1 { font-size: 2rem; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 12px; font-weight: 650; }
.intro p { margin: 0 0 12px; color: var(--muted); }
.intro p.lead { color: var(--fg); font-size: 1.125rem; }
.intro code { color: var(--fg); background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 0.9em; }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  font: inherit; font-weight: 550; line-height: 1;
  padding: 12px 18px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--border); background: transparent; color: var(--fg);
}
.btn:hover { text-decoration: none; background: var(--code-bg); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.ai-text {
  margin: 12px 0 0; padding: 12px 14px; font: 0.8125rem/1.5 var(--mono);
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  color: var(--muted); overflow-wrap: anywhere; white-space: pre-wrap;
}
.note { font-size: 0.875rem; color: var(--muted); margin: 12px 0 0; }

/* docs */
.docs { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; padding: 40px 0 96px; border-top: 1px solid var(--border); }
.docs nav { position: sticky; top: 24px; align-self: start; }
.docs nav h2, .label {
  font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 8px;
}
.docs nav a { display: block; padding: 5px 0; color: var(--muted); font-size: 0.9375rem; }
.docs nav a:hover { color: var(--fg); text-decoration: none; }
.docs nav a.on { color: var(--fg); font-weight: 600; }
.ep { padding-bottom: 56px; margin-bottom: 56px; border-bottom: 1px solid var(--border); scroll-margin-top: 24px; }
.ep:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.ep h3 { margin: 0 0 12px; font-size: 1.375rem; letter-spacing: -0.01em; font-weight: 650; }
.ep p { margin: 0 0 16px; color: var(--muted); }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 12px; font-family: var(--mono); font-size: 0.875rem; }
.method { font-weight: 600; color: var(--accent); }
.route code { overflow-wrap: anywhere; }
.codebox { position: relative; }
.codebox pre {
  margin: 0; padding: 16px; padding-right: 76px; overflow-x: auto;
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  font-size: 0.8125rem; line-height: 1.6;
}
.copy {
  position: absolute; top: 8px; right: 8px; font: inherit; font-size: 0.75rem; padding: 4px 8px;
  border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); cursor: pointer;
}
.copy:hover { color: var(--fg); }
.preview { margin-top: 24px; }

/* telegram preview */
.chat { background: var(--chat-bg); border-radius: 8px; padding: 16px; }
.bubble {
  display: inline-block; max-width: min(100%, 340px); min-width: 120px;
  background: var(--bubble); color: var(--bubble-fg);
  border-radius: 12px 12px 12px 4px; padding: 6px 10px 6px;
  font: 0.9375rem/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow: hidden;
}
.bubble .body { white-space: pre-wrap; overflow-wrap: anywhere; }
.bubble .time { text-align: right; font-size: 0.6875rem; color: var(--bubble-muted); margin-top: 2px; }
.bubble.media { padding: 3px 3px 6px; }
.bubble.media .body, .bubble.media .time { padding: 0 7px; }
.bubble.media .body { margin-top: 6px; }
.tg-tag { color: var(--tg-link); }
.tg-mono { font-family: var(--mono); font-size: 0.875em; background: var(--tg-code); border-radius: 3px; padding: 0 3px; }
.photo { display: block; width: 100%; aspect-ratio: 4 / 3; background: #8aa0b0; border-radius: 9px 9px 3px 3px; position: relative; overflow: hidden; }
.photo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.doc { display: flex; align-items: center; gap: 12px; padding: 4px 2px 0; }
.doc .icon { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--tg-link); display: grid; place-items: center; }
.doc .name { font-weight: 600; }
.doc .size { font-size: 0.8125rem; color: var(--bubble-muted); }

@media (max-width: 859px) {
  .wrap { padding: 0 20px; }
  .intro { padding: 36px 0 28px; }
  .intro h1 { font-size: 1.625rem; }
  .docs { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-top: 24px; }
  .docs nav { position: static; }
  .docs nav h2 { display: none; }
  .docs nav .links { display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px 4px; }
  .docs nav a {
    flex: none; padding: 6px 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 0.875rem;
  }
  .docs nav a.on { border-color: var(--accent); color: var(--accent); }
  .ep { scroll-margin-top: 12px; padding-bottom: 40px; margin-bottom: 40px; }
  .btn { flex: 1 1 100%; }
}
</style>
</head>
<body>
<div id="root"></div>
<script>/*__APP__*/</script>
</body>
</html>
